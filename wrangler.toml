name = "dcproxy"
compatibility_date = "2023-12-01"
main = "main.js"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[env.vars]
CUSTOM_DOMAIN = "libcuda.so"

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = "exmaple.com"

[env.production]
name = "dcprozy"
routes = [
  { pattern = "dcproxy.caplouge.workers.dev/*" },
]

[env.production.vars]
MODE = "production"
CUSTOM_DOMAIN = "dcproxy.caplouge.workers.dev"
TARGET_UPSTREAM = ""

[env.staging]
name = "cloudflare-docker-proxy-staging"
# route = { pattern = "docker-staging.libcuda.so", custom_domain = true }

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
